[package]
name = "redline-split-ops"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Its own workspace, as the other subrepos are: without this cargo keeps
# looking upward for a workspace root, and in a checkout nested inside another
# RedlineDB checkout (a lane worktree) it finds the outer one and refuses.
[workspace]

[dependencies]
serde_json = "1"
toml = "0.8"

[[bin]]
name = "redline-proof"
path = "tools/redline-proof/src/main.rs"
