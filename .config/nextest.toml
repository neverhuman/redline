# cargo-nextest configuration for the whole workspace.
#
# nextest runs every test in its own process, so the kernel's process-global
# failpoint registry cannot leak from one test into another. The
# `kernel-failpoints` group still runs those tests one at a time: each arms a
# fault in the WAL writer or the page flusher, and several of them time a
# commit against a deadline, which a machine loaded by other failpoint tests
# can miss.

[profile.default]
# Flag a test after 60s and kill it after 5 periods (300s), so one hung test
# fails the stage with its name instead of running into the job timeout.
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups]
kernel-failpoints = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(redlinedb-kernel) & (binary(failpoint_smoke) | binary(hnsw_failpoints) | binary(commit_outcome) | binary(recovery_failpoints))'
test-group = 'kernel-failpoints'
