name: packages
# Called by ci.yml, including when release-build.yml calls ci.yml: no job may
# ask for more than contents: read and attestations: read
# (ops/ci/check-workflow-permissions.sh).
#
# Linux x86_64 packaging for every event (pull requests, pushes to main,
# release tags, dispatches). Runs on the self-hosted runners so a stalled
# GitHub-hosted queue cannot hold RedlineDB/required. macOS and Linux arm64
# live in packages-cross.yml and are not part of the required aggregate.
on:
  workflow_call:
    inputs:
      # The release tag; empty packages as v<workspace version>-dev.
      tag:
        type: string
        required: false
        default: ''
# The event is part of the group, so a push and a dispatch on one ref do not
# queue behind or cancel each other. Different refs (main vs a pull request)
# never share a group, so a pull-request run cannot wait on main's run.
concurrency:
  group: packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build-linux:
    name: build (linux-x86_64)
    env:
      OUTPUT_DIR: ${{ github.workspace }}/dist/release-packages
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 90
    steps:
      - name: Unlock leftover workspace files and choose CARGO_HOME
        env:
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}" || true
          fi
          if [ "${UNTRUSTED_PR}" = true ]; then
            cargo_home="${RUNNER_TEMP}/cargo-home"
          else
            cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          fi
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash ops/ci/ensure-rust.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with: {key: packages-linux-x86_64}
      - run: bash ops/ci/apt-install.sh build-essential pkg-config
      - name: Package all distributions
        env: {TAG: '${{ inputs.tag }}'}
        run: bash ops/ci/packages.sh build
      - run: bash ops/ci/packages.sh smoke
      - run: bash ops/ci/packages.sh installer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packages-linux-x86_64
          path: ${{ env.OUTPUT_DIR }}/*
          if-no-files-found: error
  runtime-linux:
    name: runtime (linux-x86_64)
    needs: build-linux
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 15
    steps:
      - name: Unlock leftover workspace files and choose CARGO_HOME
        env:
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}" || true
          fi
          if [ "${UNTRUSTED_PR}" = true ]; then
            cargo_home="${RUNNER_TEMP}/cargo-home"
          else
            cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          fi
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: packages-linux-x86_64, path: target/packages}
      - name: Run archives without building
        run: bash ops/ci/packages.sh runtime
      - name: Install the candidate with install.sh and link a C program against it
        run: bash ops/ci/packages.sh native-install
      - name: Run the documented quick start against the candidate
        run: bash ops/ci/packages.sh quickstart
      - name: Run the post-publication check against the candidate
        run: bash ops/ci/packages.sh published-check
