name: redline-testing-report

# Runs only when a maintainer dispatches it. The daily schedule measured the
# corpus with --workers auto on a shared self-hosted runner after merge and
# rewrote the README's generated blocks from that run, not from the evidence
# a release was accepted on. docs/release.md ("Parity report") says how the
# report is regenerated.
on:
  workflow_dispatch:

concurrency:
  group: redline-testing-report
  cancel-in-progress: false

jobs:
  publish-pr:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
      actions: write
      attestations: read
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:efdf07c2f9d4df592783dcc8ea5f6db02efbf5f6452b527225ff5e58364570e9
        env:
          POSTGRES_DB: redlinedb_beyond
          POSTGRES_USER: redlinedb
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports: [5432]
        options: >-
          --health-cmd "pg_isready -U redlinedb -d redlinedb_beyond"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Unlock leftover workspace files
        run: |
          set +e
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}"
          fi
          cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
          exit 0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
          # The only checkout that keeps its token: sqlite-parity-report.sh
          # pushes the automation/sqlite-parity-report branch.
          persist-credentials: true
      # The toolchain rust-toolchain.toml pins, checked offline and installed
      # only if missing (ops/ci/ensure-rust.sh; CI-04).
      - run: bash ops/ci/ensure-rust.sh
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          bash ops/ci/apt-install.sh build-essential mold openssl sqlite3 zlib1g-dev postgresql-client
      - run: bash ops/ci/install-github-tools.sh
      - name: Publish generated SQLite and PostgreSQL parity report PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDLINEDB_BENCH_GIT_SHA: ${{ github.sha }}
          REDLINE_TESTING_POSTGRES_IMAGE: sha256:efdf07c2f9d4df592783dcc8ea5f6db02efbf5f6452b527225ff5e58364570e9
          REDLINE_TESTING_POSTGRES_URL: postgres://redlinedb:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/redlinedb_beyond
        run: bash ops/ci/sqlite-parity-report.sh publish-pr
