name: ci

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      # The release tag being accepted. Empty (push, pull request, dispatch)
      # packages as v<workspace version>-dev (ops/ci/release-version.sh dev-tag).
      tag:
        type: string
        default: ''
  push:
    branches: [main]
  pull_request:

# The event is part of the group: a push and a workflow_dispatch on the same
# ref are different runs and used to cancel each other (CI-04).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Each self-hosted job exports CARGO_HOME in its first step (workflow-level
# runner context is unavailable and rejects the file); hosted jobs keep the
# image's ~/.cargo. Leave CARGO_TARGET_DIR unset
# so cargo and scripts share $PWD/target; artifact uploads and parity look
# for target/release and target/redline-testing.
#
# Runners (CI-04): every trusted job runs on the self-hosted runners
# (labels self-hosted, Linux, X64), including RedlineDB/required, the light
# jobs (lint, official-evidence-guard, typecheck, test, components, security,
# audit), and Linux x86_64 packaging (packages.yml), so a stalled GitHub-hosted
# queue cannot hold the merge gate. They check the pinned toolchain offline
# with ops/ci/ensure-rust.sh instead of downloading it in every job.
# Linux arm64 packaging also runs on Linux X64 (cross-compile plus QEMU).
# Hosted macOS packaging is release-only; ordinary CI skips it. The tagged
# release still requires native macOS archives and checks on both platforms.
#
# Trust boundary (docs/ci-trust-boundary.md): a pull request from a fork runs
# on GitHub-hosted runners with a job-local CARGO_HOME, never on the
# self-hosted runners or their shared cache. Every self-hosted job repeats
# the same fork test, in runs-on and in the first step:
#   github.event_name == 'pull_request' &&
#   github.event.pull_request.head.repo.full_name != github.repository
# The parity lane and the kernel stage run only on the self-hosted runners;
# for a fork, RedlineDB/required fails until a maintainer runs ci on a
# canonical branch at the same commit. No checkout keeps its token: nothing
# in this workflow pushes.
#
# Permissions: release-build.yml calls this workflow (and through it
# packages.yml and packages-cross.yml) with contents: read and attestations:
# read. No job here or in those package workflows may ask for more: GitHub
# refuses to start the whole tag run, whatever the job's `if:` says. A job
# that needs more gets its own workflow, as report-merge.yml does. The
# preflight enforces this with ops/ci/check-workflow-permissions.sh.

jobs:
  preflight:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      # v4.2.2 uses direct local git auth config. The newer pinned checkout
      # SHA intermittently failed before lane logic while fetching PR merge refs.
      - name: Unlock leftover workspace files and choose CARGO_HOME
        env:
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}" || true
          fi
          if [ "${UNTRUSTED_PR}" = true ]; then
            cargo_home="${RUNNER_TEMP}/cargo-home"
          else
            cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          fi
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      # The toolchain rust-toolchain.toml pins, checked offline and installed
      # only if missing (dtolnay/rust-toolchain fetches the channel manifest
      # in every job, and the runners' link to it often times out).
      - run: bash ops/ci/ensure-rust.sh
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          bash ops/ci/apt-install.sh build-essential pkg-config openssl sqlite3 zlib1g-dev
      # Thin dispatcher: all fast-lane logic lives in ops/ci/fast.sh so
      # CI and local (`scripts/ci-local.sh fast`, `just fast`, the
      # pre-push gate) run the same command set. The preflight stage is
      # isolated here and the test shards fan out below so no single job
      # exceeds the GitHub timeout.
      - run: CI_FAST_STAGE=preflight bash ops/ci/fast.sh

  tests:
    strategy:
      fail-fast: false
      matrix:
        stage:
          - core
          - kernel
          - kernel-failpoints
          - sql-unit
          - sql-contracts
          - sql-integration
          - bench
          - qualification
        # The kernel stage runs only on the self-hosted runners. For a fork
        # pull request a maintainer runs it (docs/ci-trust-boundary.md).
        exclude:
          - stage: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'kernel' || '' }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    # kernel is the sequential `cargo test` of the whole kernel crate;
    # kernel-failpoints builds it with --features failpoints and runs only the
    # failpoint-gated tests (ops/ci/fast.sh).
    timeout-minutes: ${{ matrix.stage == 'kernel-failpoints' && 30 || 45 }}
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Unlock leftover workspace files and choose CARGO_HOME
        env:
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}" || true
          fi
          if [ "${UNTRUSTED_PR}" = true ]; then
            cargo_home="${RUNNER_TEMP}/cargo-home"
          else
            cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          fi
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      # The toolchain rust-toolchain.toml pins, checked offline and installed
      # only if missing (dtolnay/rust-toolchain fetches the channel manifest
      # in every job, and the runners' link to it often times out).
      - run: bash ops/ci/ensure-rust.sh
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          bash ops/ci/apt-install.sh build-essential pkg-config openssl sqlite3 zlib1g-dev
      # Digest-pinned and job-local: a cargo-nextest already on the runner's
      # PATH is never used. Only trusted jobs reuse the verified archive.
      - name: Install pinned cargo-nextest
        env:
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "${UNTRUSTED_PR}" != true ]; then
            export CI_NEXTEST_CACHE_DIR="${RUNNER_TOOL_CACHE}/redlinedb-tools"
          fi
          bash ops/ci/install-nextest.sh "${RUNNER_TEMP}/nextest-bin"
      - name: Run fast test shard
        env:
          REDLINEDB_BENCH_GIT_SHA: ${{ github.sha }}
        run: CI_FAST_STAGE=${{ matrix.stage }} bash ops/ci/fast.sh
      # SQ-08: sqlite_rust_values.json and sqlite_c_abi.json, generated by the
      # qualification shard from its own test runs, with the logs behind them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && matrix.stage == 'qualification' }}
        with:
          name: sqlite-qualification
          if-no-files-found: warn
          path: |
            target/qualification/**
  parity:
    # The Postgres-backed parity lane runs only on the self-hosted runners.
    # For a fork pull request a maintainer runs it (docs/ci-trust-boundary.md).
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
    strategy:
      fail-fast: false
      matrix:
        stage:
          - redline-testing-official
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 180
    permissions:
      contents: read
      attestations: read
    # Beyond-SQLite cases compare RedlineDB against a live PostgreSQL oracle.
    # Without one the runner skips them ("postgres unavailable"), and a skip
    # does not fail the suite - so the lane reported success while measuring
    # nothing. The host port is assigned by the runner so concurrent parity
    # jobs on a shared self-hosted host cannot collide.
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:efdf07c2f9d4df592783dcc8ea5f6db02efbf5f6452b527225ff5e58364570e9
        env:
          POSTGRES_DB: redlinedb_beyond
          POSTGRES_USER: redlinedb
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U redlinedb -d redlinedb_beyond"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Unlock leftover workspace files and choose CARGO_HOME
        env:
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}" || true
          fi
          if [ "${UNTRUSTED_PR}" = true ]; then
            cargo_home="${RUNNER_TEMP}/cargo-home"
          else
            cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          fi
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      # The toolchain rust-toolchain.toml pins, checked offline and installed
      # only if missing (dtolnay/rust-toolchain fetches the channel manifest
      # in every job, and the runners' link to it often times out).
      - run: bash ops/ci/ensure-rust.sh
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          bash ops/ci/apt-install.sh build-essential pkg-config openssl sqlite3 zlib1g-dev postgresql-client
      - name: Run parity shard
        env:
          REDLINEDB_BENCH_GIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REDLINE_TESTING_POSTGRES_IMAGE: sha256:efdf07c2f9d4df592783dcc8ea5f6db02efbf5f6452b527225ff5e58364570e9
          REDLINE_TESTING_POSTGRES_URL: postgres://redlinedb:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/redlinedb_beyond
        run: CI_PARITY_STAGE=${{ matrix.stage }} bash ops/ci/parity.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: redline-testing-official-evidence
          if-no-files-found: warn
          path: |
            target/redline-testing/**

  official-evidence-guard:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Unlock leftover workspace files and choose CARGO_HOME
        env:
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}" || true
          fi
          if [ "${UNTRUSTED_PR}" = true ]; then
            cargo_home="${RUNNER_TEMP}/cargo-home"
          else
            cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          fi
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - run: bash ops/ci/ensure-rust.sh
      - name: Install ripgrep
        run: bash ops/ci/apt-install.sh ripgrep
      - name: Guard official evidence boundary
        run: bash scripts/guard-official-evidence.sh

  # Engine unit tests and the CLI's own tests. Packaging builds the release
  # CLI on every platform (build-from-source.sh --all), so the build and cli
  # jobs that repeated `cargo build --release -p redlinedb-cli` are gone.
  test:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Unlock leftover workspace files and choose CARGO_HOME
        env:
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}" || true
          fi
          if [ "${UNTRUSTED_PR}" = true ]; then
            cargo_home="${RUNNER_TEMP}/cargo-home"
          else
            cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          fi
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - run: bash ops/ci/ensure-rust.sh
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          bash ops/ci/apt-install.sh build-essential pkg-config openssl sqlite3 zlib1g-dev
      - name: Engine unit tests
        run: |
          cargo test --locked --workspace --lib
          cargo test --locked -p redlinedb-cli

  lint:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Unlock leftover workspace files and choose CARGO_HOME
        env:
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}" || true
          fi
          if [ "${UNTRUSTED_PR}" = true ]; then
            cargo_home="${RUNNER_TEMP}/cargo-home"
          else
            cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          fi
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - run: bash ops/ci/ensure-rust.sh
      - name: rustfmt
        run: cargo fmt --check

  typecheck:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Unlock leftover workspace files and choose CARGO_HOME
        env:
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}" || true
          fi
          if [ "${UNTRUSTED_PR}" = true ]; then
            cargo_home="${RUNNER_TEMP}/cargo-home"
          else
            cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          fi
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - run: bash ops/ci/ensure-rust.sh
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          bash ops/ci/apt-install.sh build-essential pkg-config openssl sqlite3 zlib1g-dev
      - name: Workspace typecheck
        run: cargo check --workspace --locked

  components:
    strategy:
      fail-fast: false
      matrix:
        lane: [testing, central, web, release-tools]
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Unlock leftover workspace files and choose CARGO_HOME
        env:
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}" || true
          fi
          if [ "${UNTRUSTED_PR}" = true ]; then
            cargo_home="${RUNNER_TEMP}/cargo-home"
          else
            cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          fi
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash ops/ci/ensure-rust.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with: {key: '${{ matrix.lane }}'}
      - run: bash ops/ci/apt-install.sh pkg-config sqlite3
      - run: bash scripts/ci-family.sh "${{ matrix.lane }}"

  # The integration lane release-builds every component and runs the web
  # console's Playwright suite against it, so it stays on the self-hosted
  # runners.
  components-integration:
    name: components (integration)
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Unlock leftover workspace files and choose CARGO_HOME
        env:
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}" || true
          fi
          if [ "${UNTRUSTED_PR}" = true ]; then
            cargo_home="${RUNNER_TEMP}/cargo-home"
          else
            cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          fi
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # The toolchain rust-toolchain.toml pins, checked offline and installed
      # only if missing (dtolnay/rust-toolchain fetches the channel manifest
      # in every job, and the runners' link to it often times out).
      - run: bash ops/ci/ensure-rust.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with: {key: integration}
      - run: bash ops/ci/apt-install.sh pkg-config sqlite3
      - run: bash scripts/ci-family.sh integration

  audit:
    needs: security
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 45
    permissions: {contents: read}
    steps:
      - name: Unlock leftover workspace files and choose CARGO_HOME
        env:
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}" || true
          fi
          if [ "${UNTRUSTED_PR}" = true ]; then
            cargo_home="${RUNNER_TEMP}/cargo-home"
          else
            cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          fi
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash ops/ci/ensure-rust.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install security tools for this runner
        run: |
          cargo install cargo-audit --locked --version 0.22.1
          cargo install cargo-deny --locked --version 0.19.8
      - run: bash ops/ci/install-github-tools.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: security-evidence, path: target/jankurai/security}
      - name: Audit engine against the accepted baseline
        run: jankurai audit . --full --mode ratchet --baseline .jankurai/baselines/github-monorepo.repo-score.json --json target/audit-family/engine/repo-score.json --md target/audit-family/engine/repo-score.md --no-score-history --policy agent/audit-policy.toml
      - name: Run the jankurai tool lane (proofbind, proofmark, rust witness, copy-code)
        run: bash ops/ci/jankurai-audit.sh
      - run: bash ops/ci/audit-family.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with: {name: audit-family, path: target/audit-family, if-no-files-found: warn}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with: {name: jankurai-tool-evidence, path: target/jankurai, if-no-files-found: warn}

  security:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 45
    permissions: {contents: read}
    steps:
      - name: Unlock leftover workspace files and choose CARGO_HOME
        env:
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}" || true
          fi
          if [ "${UNTRUSTED_PR}" = true ]; then
            cargo_home="${RUNNER_TEMP}/cargo-home"
          else
            cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          fi
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # The receipt's gitleaks scan covers the whole history.
          fetch-depth: 0
          persist-credentials: false
      - run: bash ops/ci/ensure-rust.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - run: cargo install cargo-audit --locked --version 0.22.1
      - run: cargo install cargo-deny --locked --version 0.19.8
      - run: bash ops/ci/install-github-tools.sh
      - run: |
          jankurai security run . --strict --profile ci --script ops/ci/security-family.sh --out target/jankurai/security/evidence.json || {
            cat target/jankurai/security/security-lane-*.log
            exit 1
          }
      # The release receipt for this commit (docs/security-scans.md): every
      # lockfile's audit and deny results, the advisory databases' age and a
      # full-history gitleaks scan, in target/security/receipt.json.
      - name: Write the security receipt
        run: bash ops/ci/security-receipt.sh
      # Release acceptance binds both (ops/release/acceptance-receipts).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with: {name: security-evidence, path: target/jankurai/security, if-no-files-found: warn}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with: {name: security-receipt, path: target/security, if-no-files-found: warn}

  durability-receipt:
    # Release runs only (release-build.yml calls this workflow with the tag).
    # The durability receipts committed under benchmark-results/durability/
    # (taken once per release candidate on a real disk with
    # `redlinedb-bench durability-evidence`, docs/manual/durability.md
    # "Receipts") must back the durability claim at this commit; the job fails
    # without a receipt or when durability-evidence-verify refuses them, and
    # uploads them as durability-evidence, which release acceptance binds
    # (ops/release/acceptance-receipts). Other runs skip it, and
    # RedlineDB/required accepts that skip only when there is no tag.
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # The verifier walks from each receipt's commit to this one.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with: {toolchain: 1.95.0}
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Verify the committed durability receipts
        run: bash ops/ci/durability-receipt.sh target/durability-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: durability-evidence, path: target/durability-evidence, if-no-files-found: error}

  packaging:
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ inputs.tag || '' }}
    permissions:
      contents: read

  # ARM64 runs for trusted events, including PRs; native macOS is tag-only.
  packaging-cross:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/packages-cross.yml
    with:
      tag: ${{ inputs.tag || '' }}
    permissions:
      contents: read

  required:
    name: RedlineDB/required
    if: always()
    needs: [preflight, tests, parity, official-evidence-guard, test, lint, typecheck, components, components-integration, audit, security, packaging, packaging-cross, durability-receipt]
    # jq only; it starts after every job it needs has finished.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - name: Require every gate to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          RELEASE_TAG: ${{ inputs.tag || '' }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ "${FORK_PR}" = true ]; then
            echo "::error title=Maintainer run required::This pull request comes from a fork, so it ran on GitHub-hosted runners without the parity lane or the kernel test stage. A maintainer must review it and run ci on a canonical branch at this commit before it can merge. See docs/ci-trust-boundary.md."
            exit 1
          fi
          # durability-receipt runs only for a release tag; without one its
          # skip is expected. packaging-cross checks ARM64 on self-hosted X64;
          # its macOS jobs skip without a tag. Every listed job must succeed.
          echo "$RESULTS" | jq -e --arg tag "$RELEASE_TAG" \
            'to_entries | length > 0 and all(.value.result == "success" or ($tag == "" and .key == "durability-receipt" and .value.result == "skipped"))'
