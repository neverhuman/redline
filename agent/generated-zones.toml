[[zone]]
command = "hand-authored ABI surface; see docs/exceptions/ffi-c-header.md"
path = "contracts/c-abi/redlinedb.h"
read_only = true
source = "C ABI surface for the redlinedb sqlite3-compatible API; relocated from crates/ffi/include/ per docs/exceptions/ffi-c-header.md; not product truth"

[[zone]]
command = "just sqlite-parity-report-update"
path = "benchmark-results/sqlite-parity/latest/"
read_only = false
source = "SQLite parity report raw data, ranked CSV, summary, manifest, and official-evidence.processed.json staged from the verified redline-testing official evidence bundle"

[[zone]]
command = "just sqlite-parity-report-update"
path = "benchmark-results/sqlite-parity/latest/jankurai-comparison.json"
read_only = false
source = "Compact Jankurai comparison generated from .jankurai/repo-score.json and target/sqlite-jankurai/repo-score.json"

[[zone]]
command = "just sqlite-parity-report-update"
path = "paper/data/loc_comparison.csv"
read_only = false
source = "paper LOC comparison data generated by the core Rust source-line scanner"

[[zone]]
command = "scripts/perf/release-bench.sh --bundle <name> <label>=<binary> ..."
path = "benchmark-results/sqlite-parity/releases/"
read_only = false
source = "Release bench bundles (L-05): raw runner records, build contracts, host load records, the bundle README and summary.json, written by scripts/perf/release-bench.sh and perf_evidence summarize-bundle; the README block between <!-- version-history:begin --> and <!-- version-history:end --> is rendered from summary.json by redline-testing version-history --bundle <bundle> --readme README.md and is never edited by hand"

[[zone]]
command = "scripts/perf/scoreboard-bench.sh --bundle <name> <label>=<binary> ... && redline-scoreboard summarize --bundle benchmark-results/perf/releases/<name> --check"
path = "benchmark-results/perf/releases/"
read_only = false
source = "Immutable engine-throughput scoreboard bundles: raw RedlineDB and SQLite measurements, build and host contracts, and derived summary.json. The README block between <!-- engine-throughput:begin --> and <!-- engine-throughput:end --> is generated by redline-scoreboard render --bundle <bundle> --target README.md and never edited by hand"

[[zone]]
command = "node scripts/docs/render-coverage.mjs"
path = "docs/known-limitations.md"
read_only = false
source = "scripts/docs/known-limitations.md.in, committed official-evidence.processed.json and parity policies. The same generator renders the README and docs/rql.md rql-coverage marker blocks; never edit these generated counts by hand."

[[zone]]
command = "node scripts/perf/abba-summary.mjs <bundle> && node scripts/perf/abba-summary.mjs <bundle> --report"
path = "benchmark-results/perf/regressions/"
read_only = false
source = "Owner-approved contended-host paired ABBA diagnostics, recorded separately from publishable release scoreboard bundles: immutable plan, raw samples, host telemetry, build records and receipt hashes; derived summary/report and optional main-regression README block are generated, never typed"
