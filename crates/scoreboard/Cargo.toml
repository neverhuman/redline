[package]
name = "redlinedb-scoreboard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Engine throughput scoreboard: RedlineDB and SQLite in-process on the same fixed work."

[lib]
path = "src/lib.rs"

[[bin]]
name = "redline-scoreboard"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
redlinedb = { path = "../redlinedb" }
# No features. `redlinedb-bench` turns the kernel's failpoints on, so none
# of its binaries may publish a number; this crate exists to measure the
# kernel users get. Build it with `-p redlinedb-scoreboard` only: a
# workspace-wide build unifies features and brings the failpoints back.
redlinedb-kernel = { path = "../kernel" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
